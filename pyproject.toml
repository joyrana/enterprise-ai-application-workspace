[project]
name = "enterprise-ai-application-workspace"
version = "0.1.0"
description = "Workspace root (uv workspace). Not a distributable package."
requires-python = ">=3.12"
dependencies = ["appspec", "codegen-react", "design-system", "model-gateway", "skill-sdk", "workspace-skills", "workspace-evals", "workspace-api"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/application-spec", "packages/codegen-react", "packages/design-system", "packages/model-gateway", "packages/skill-sdk", "skills", "evals", "services/api"]

[tool.uv.sources]
appspec = { workspace = true }
codegen-react = { workspace = true }
design-system = { workspace = true }
model-gateway = { workspace = true }
skill-sdk = { workspace = true }
workspace-skills = { workspace = true }
workspace-evals = { workspace = true }
workspace-api = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["services/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT", "TID", "ASYNC"]
ignore = ["S101"]  # asserts are fine in tests and narrowing

[tool.ruff.lint.isort]
known-first-party = ["appspec", "codegen_react", "design_system", "model_gateway", "skill_sdk", "workspace_skills", "workspace_evals", "workspace_api"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "packages/application-spec/src",
  "packages/codegen-react/src",
  "packages/design-system/src",
  "packages/model-gateway/src",
  "packages/skill-sdk/src",
  "skills/src",
  "evals/src",
  "services/api/src",
]
explicit_package_bases = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = [
  "packages/application-spec/tests",
  "packages/codegen-react/tests",
  "packages/design-system/tests",
  "packages/model-gateway/tests",
  "packages/skill-sdk/tests",
  "skills/tests",
  "evals/tests",
  "services/api/tests",
]
markers = ["db: requires a PostgreSQL database (DATABASE_URL)"]
