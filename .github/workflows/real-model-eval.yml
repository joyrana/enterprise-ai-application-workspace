name: Real-model evaluation (Ollama)

# Runs the discovery and routing evaluations against a REAL open-weight model served by
# Ollama inside the CI runner (CPU only, no secrets, prompts never leave the runner).
#
# Opt-in, because it is slow (tens of minutes) and its results describe a small model on
# CPU, not a production deployment:
#   * Actions → "Real-model evaluation (Ollama)" → Run workflow (choose a model), or
#   * push a commit to a non-main branch whose message contains "[real-eval]".
#
# Results are published as run notices and as the `real-model-eval-reports` artifact.
# Quality thresholds are not enforced yet (ADR-0009/0010): this collects baselines.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model tag (must fit a CPU runner)"
        default: "qwen3:4b-instruct"
        required: true
      repeats:
        description: "Repeats per case (1-3)"
        default: "1"
        required: true
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: real-model-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[real-eval]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      ollama:
        image: ollama/ollama:0.35.0
        env:
          # Discovery prompts include a JSON Schema; the default context window is too small.
          OLLAMA_CONTEXT_LENGTH: "8192"
        ports: ["11434:11434"]
    env:
      MODEL_PROFILE: ollama
      MODEL_BASE_URL: http://localhost:11434/v1
      MODEL_ID: ${{ inputs.model || 'qwen3:4b-instruct' }}
      REPEATS: ${{ inputs.repeats || '1' }}
      MODEL_TIMEOUT_SECONDS: "600"
      MODEL_MAX_OUTPUT_TOKENS: "2048"
      MODEL_TEMPERATURE: "0"
      MODEL_SEED: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$MODEL_ID" =~ ^[a-z0-9._:-]{1,64}$ ]] || { echo "::error::invalid model tag"; exit 1; }
          [[ "$REPEATS" =~ ^[1-3]$ ]] || { echo "::error::repeats must be 1-3"; exit 1; }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Wait for Ollama and pull the model
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do curl -fsS http://localhost:11434/api/version && break; sleep 2; done
          echo
          curl -fsS --max-time 1800 http://localhost:11434/api/pull -d "{\"model\": \"${MODEL_ID}\", \"stream\": false}"
          echo
          digest=$(curl -fsS http://localhost:11434/api/tags | python3 -c "import json,sys,os; m=[x for x in json.load(sys.stdin)['models'] if x['name']==os.environ['MODEL_ID'] or x['model']==os.environ['MODEL_ID']]; print(m[0]['digest'][:16] if m else 'unknown')")
          version=$(curl -fsS http://localhost:11434/api/version | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "::notice title=model under test::${MODEL_ID} (digest ${digest}), Ollama ${version}, CPU runner, temperature 0, seed 7"
      - name: Warm up (load weights)
        run: |
          curl -fsS --max-time 900 http://localhost:11434/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d "{\"model\": \"${MODEL_ID}\", \"messages\": [{\"role\": \"user\", \"content\": \"Reply with OK\"}], \"max_tokens\": 5}" > /dev/null
      - name: Routing evaluation (model router)
        env:
          SUMMARY_PATTERN: "^routing\\["
        run: >-
          $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "routing eval"
          uv run python -m workspace_evals.routing --method router --repeats "$REPEATS"
          --deadline-s 600 --out reports/evals
      - name: Discovery evaluation
        if: always()
        env:
          SUMMARY_PATTERN: "^discovery\\["
        run: >-
          $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "discovery eval"
          uv run python -m workspace_evals.discovery --repeats "$REPEATS"
          --deadline-s 1200 --out reports/evals
      - name: Publish reports as notices
        if: always()
        run: |
          shopt -s nullglob
          for f in reports/evals/*.md; do
            body=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=$(basename "$f")::${body}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: real-model-eval-reports
          path: reports/evals/
          retention-days: 30
