name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repository or uses secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests, contracts, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      REQUIRE_DB: "1" # database tests fail instead of skipping when Postgres is missing
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "uv sync" uv sync --locked
      - name: Format
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "ruff format" uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format github .
      - name: Type check
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "mypy" uv run mypy packages/org-policy/src services/build-runner/src packages/codegen-angular/src packages/application-spec/src packages/codegen-react/src packages/design-system/src packages/model-gateway/src packages/skill-sdk/src skills/src evals/src services/api/src
      - name: Tests (unit + integration against PostgreSQL)
        env:
          SUMMARY_PATTERN: "[0-9]+ passed"
        run: >-
          $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "pytest"
          uv run pytest --tb=short
          --cov=appspec --cov=build_runner --cov=codegen_angular --cov=org_policy --cov=codegen_react --cov=design_system --cov=model_gateway --cov=skill_sdk --cov=workspace_skills --cov=workspace_evals --cov=workspace_api --cov-report=term-missing
          --junitxml=reports/pytest.xml
      - name: Routing eval baseline (lexical, deterministic; no thresholds yet)
        env:
          SUMMARY_PATTERN: "^routing\\["
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "routing eval" uv run python -m workspace_evals.routing --method lexical --out reports/evals
      - name: Injection detector eval (deterministic; floors enforced)
        env:
          SUMMARY_PATTERN: "^injection"
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "injection eval" uv run python -m workspace_evals.injection --out reports/evals
      - name: Generated contracts are up to date
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "contracts" uv run python -m workspace_api.export --check --out contracts
      - name: Dependency vulnerability audit
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "pip-audit" uv run pip-audit --skip-editable --progress-spinner off
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-test-report
          path: reports/
          retention-days: 14

  web:
    name: Workspace web (contracts, lint, types, tests, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/workspace-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/workspace-web/package-lock.json
      - name: Install (locked)
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "npm ci" npm ci
      - name: Generated API types match the OpenAPI contract
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "API types" npm run check:api
      - name: Format
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "prettier" npm run format:check
      - name: Lint (including accessibility rules)
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "eslint" npm run lint
      - name: Type check
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "tsc" npm run typecheck
      - name: Tests
        env:
          DEBUG_PRINT_LIMIT: "1500" # keep DOM dumps short so failure annotations show the summary
          SUMMARY_PATTERN: "(Test Files|Tests) +[0-9]+"
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "vitest" npm test
      - name: Production build
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "build" npm run build
      - name: Dependency vulnerability audit (runtime dependencies)
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "npm audit" npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      APP_ENV: test
      # A scripted OpenAI-compatible server stands in for the model: the real HTTP provider path
      # is exercised, with deterministic answers. Model quality is measured separately (real-model-eval.yml).
      MODEL_PROFILE: self-hosted
      MODEL_BASE_URL: http://127.0.0.1:9100/v1
      MODEL_ID: fake-e2e
      MODEL_REMOTE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/workspace-web/package-lock.json
      - name: Install (locked)
        run: |
          uv sync --locked
          (cd apps/workspace-web && npm ci)
      - name: Migrate database
        working-directory: services/api
        run: uv run alembic upgrade head
      - name: Start model stub and API
        run: |
          set -euo pipefail
          nohup uv run python scripts/e2e/fake_openai_server.py --port 9100 > fake-model.log 2>&1 &
          nohup uv run uvicorn workspace_api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/readyz && exit 0
            sleep 1
          done
          echo "::error::API did not become ready"; tail -n 50 api.log; exit 1
      - name: Install Chromium for Playwright
        working-directory: apps/workspace-web
        run: npx playwright install --with-deps chromium
      - name: Build web app
        working-directory: apps/workspace-web
        run: npm run build
      - name: End-to-end tests
        working-directory: apps/workspace-web
        env:
          SUMMARY_PATTERN: "[0-9]+ (passed|failed)"
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "playwright" npm run e2e
      - name: API log and recent runs on failure
        if: failure()
        run: |
          body=$(grep -v '"http.request"' api.log | tail -n 60 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=api.log tail::${body}"
          runs=$( (python3 scripts/e2e/dump_runs.py 2>&1 || true) | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=recent AI runs::${runs}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/workspace-web/playwright-report/
            apps/workspace-web/test-results/
            api.log
            fake-model.log
          retention-days: 14

  generated-apps:
    name: Generated apps (build + Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/workspace-web/package-lock.json
            toolchains/angular/package-lock.json
      - name: Install (locked)
        run: |
          uv sync --locked
          (cd apps/workspace-web && npm ci)
          (cd toolchains/angular && npm ci --no-audit --no-fund)
      - name: Generate example apps
        run: |
          set -euo pipefail
          spec=packages/application-spec/examples/finance-operations.json
          uv run python -m codegen_react --spec "$spec" --revision 2 --out apps/workspace-web/.generated/finance-screens
          uv run python -m codegen_react --spec "$spec" --revision 2 --without-screens --out apps/workspace-web/.generated/finance-entities
          uv run python -m codegen_react --spec "$spec" --revision 2 --without-screens --out apps/workspace-web/.generated/finance-entities-http
          uv run python -m codegen_angular --spec "$spec" --revision 2 --out apps/workspace-web/.generated/finance-angular-screens
          uv run python -m codegen_angular --spec "$spec" --revision 2 --without-screens --out apps/workspace-web/.generated/finance-angular
      - name: Type-check and build generated apps (strict TypeScript, locked toolchain)
        working-directory: apps/workspace-web
        run: |
          set -euo pipefail
          for app in finance-screens finance-entities finance-entities-http; do
            # The -http variant talks to the contract-following test backend (scripts/e2e/fake_data_api.py).
            api_url=""
            if [ "$app" = "finance-entities-http" ]; then api_url="http://127.0.0.1:4310"; fi
            $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "tsc $app" npx tsc -p ".generated/$app/tsconfig.json"
            VITE_DATA_API_URL="$api_url" $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "vite build $app" npx vite build ".generated/$app" --logLevel warn
          done
          echo "::notice title=generated apps::finance-screens, finance-entities and finance-entities-http type-check and build"
      - name: Build generated Angular apps (strict templates, locked Angular toolchain)
        working-directory: apps/workspace-web
        env:
          NG_CLI_ANALYTICS: "false"
        run: |
          set -euo pipefail
          for app in finance-angular-screens finance-angular; do
            ln -s "$GITHUB_WORKSPACE/toolchains/angular/node_modules" ".generated/$app/node_modules"
            (cd ".generated/$app" && $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "ng build $app" npx ng build)
          done
          echo "::notice title=generated apps::finance-angular-screens and finance-angular build with Angular 22.2.2 and Material 3"
      - name: Install Chromium for Playwright
        working-directory: apps/workspace-web
        run: npx playwright install --with-deps chromium
      - name: Browser tests with axe on every generated route
        working-directory: apps/workspace-web
        env:
          SUMMARY_PATTERN: "[0-9]+ (passed|failed)"
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "generated apps" npx playwright test -c playwright.generated.config.ts

  build-runner:
    name: Isolated build runner (container sandbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Build the runner image (workspace lockfile, installed without scripts)
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "runner image" docker build -f services/build-runner/Dockerfile -t workspace-build-runner:local .
      - name: Build a generated app in the sandbox; probe the sandbox with a hostile project; reject a tampered one
        run: $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "sandbox e2e" uv run python scripts/ci/sandbox_e2e.py --out reports/build-runner
      - name: Upload build-runner reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-runner-reports
          path: reports/build-runner/*.json
          retention-days: 14

  benchmark:
    name: Benchmark (spec → React and Angular apps, every app built)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/workspace-web/package-lock.json
            toolchains/angular/package-lock.json
      - name: Install (locked)
        run: |
          uv sync --locked
          (cd apps/workspace-web && npm ci)
          (cd toolchains/angular && npm ci --no-audit --no-fund)
      - name: Generate every benchmark app
        run: uv run python -m workspace_evals.benchmark --out reports/benchmark --write-projects apps/workspace-web/.generated/benchmark
      - name: Build every benchmark app with the locked toolchains
        working-directory: apps/workspace-web
        env:
          NG_CLI_ANALYTICS: "false"
        run: |
          set -uo pipefail
          : > "$GITHUB_WORKSPACE/reports/benchmark/builds.tsv"
          for dir in .generated/benchmark/*/; do
            name="$(basename "$dir")"
            spec="${name%-*}"
            target="${name##*-}"
            if [ "$target" = "react" ]; then
              npx tsc -p "$dir/tsconfig.json" > "$dir/build.log" 2>&1 && npx vite build "$dir" --logLevel error >> "$dir/build.log" 2>&1
            else
              ln -s "$GITHUB_WORKSPACE/toolchains/angular/node_modules" "$dir/node_modules"
              (cd "$dir" && npx ng build) > "$dir/build.log" 2>&1
            fi
            if [ $? -eq 0 ]; then result=ok; else result=failed; tail -n 40 "$dir/build.log"; fi
            printf '%s\t%s\t%s\n' "$spec" "$target" "$result" >> "$GITHUB_WORKSPACE/reports/benchmark/builds.tsv"
            echo "$name: $result"
          done
      - name: Report (fails if any guarantee or build failed)
        env:
          SUMMARY_PATTERN: "^benchmark\\["
        run: |
          $GITHUB_WORKSPACE/scripts/ci/run-annotated.sh "benchmark" uv run python -m workspace_evals.benchmark --out reports/benchmark --builds reports/benchmark/builds.tsv
          cat reports/benchmark/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report
          path: reports/benchmark/
          retention-days: 30

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
