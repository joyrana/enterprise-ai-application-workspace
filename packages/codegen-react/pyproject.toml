[project]
name = "codegen-react"
version = "0.1.0"
description = "Deterministic React + Fluent 2 code generation from the UI render tree (ADR-0014)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "appspec", "design-system"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegen_react"]

[tool.uv.sources]
appspec = { workspace = true }
design-system = { workspace = true }
