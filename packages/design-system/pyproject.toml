[project]
name = "design-system"
version = "0.1.0"
description = "UI intermediate representation, design-system contracts and adapters (Fluent 2 first)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "appspec"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/design_system"]

[tool.uv.sources]
appspec = { workspace = true }
