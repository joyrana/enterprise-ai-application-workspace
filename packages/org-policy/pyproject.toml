[project]
name = "org-policy"
version = "0.1.0"
description = "Organization policies: typed, versioned rules evaluated deterministically against specs and the UI IR (ADR-0018)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "appspec", "design-system"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/org_policy"]

[tool.uv.sources]
appspec = { workspace = true }
design-system = { workspace = true }
