[project]
name = "build-runner"
version = "0.1.0"
description = "Isolated, offline builds of generated projects in a locked-down container (ADR-0015). Standard library only."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
build-runner = "build_runner.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_runner"]
