[project]
name = "workspace-api"
version = "0.1.0"
description = "Backend API for the Enterprise AI Application Workspace (projects, specifications, audit)."
requires-python = ">=3.12"
dependencies = [
  "appspec",
  "model-gateway",
  "skill-sdk",
  "workspace-skills",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
workspace-api-export-openapi = "workspace_api.export:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_api"]

[tool.uv.sources]
appspec = { workspace = true }
model-gateway = { workspace = true }
skill-sdk = { workspace = true }
workspace-skills = { workspace = true }
